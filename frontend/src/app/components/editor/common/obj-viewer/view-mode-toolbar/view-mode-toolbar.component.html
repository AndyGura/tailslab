<div class="view-mode-toolbar">
  <button (click)="frameAll()" title="Frame all">
    <img src="assets/editor/icons/home.svg" alt="Frame all" />
  </button>
  <div class="separator"></div>
  @for (option of viewModeController?.listViewModes; track option) {
    <button [class.selected]="currentViewMode === option" (click)="setViewMode(option)" [title]="buttons[option].title">
      <img [src]="'assets/editor/icons/shading_' + buttons[option].icon + '.svg'" [alt]="buttons[option].title" />
    </button>
  }
</div>
