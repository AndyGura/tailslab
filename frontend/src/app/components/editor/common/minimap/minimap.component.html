<div class="container">
  <svg
    [attr.viewBox]="'0 0 ' + (svgSize$ | async)?.x + ' ' + (svgSize$ | async)?.y"
    shape-rendering="geometricPrecision"
    (mousemove)="drag($event)"
    (mouseup)="endDrag()"
    (mouseleave)="endDrag()">
    <!-- other roads -->
    @for (road of mapRoadPolylines$ | async; track $index) {
      <polyline [attr.points]="road" style="fill: none; stroke: #8a8a8a; stroke-width: 2"></polyline>
    }
    <!-- track -->
    <polyline
      [attr.points]="mapPolyline$ | async"
      [ngStyle]="{ 'stroke-width': 3 }"
      style="fill: none; stroke: #333333"></polyline>
    @for (point of mapPoints$ | async; track $index) {
      <circle [attr.cx]="point.x" [attr.cy]="point.y" [attr.r]="2" fill="#333333"></circle>
    }
    <!-- camera indicator -->
    @if (mapPointer$ | async) {
      <circle
        [attr.cx]="(mapPointer$ | async)?.x || 0"
        [attr.cy]="(mapPointer$ | async)?.y || 0"
        [attr.r]="10"
        fill="#e30"
        stroke="black"
        stroke-width="3"
        (mousedown)="startDrag($event)"
        style="cursor: pointer"></circle>
    }
  </svg>
  @if (!pointsOnly) {
    <div class="info_div">
      <span>Track length (m): {{ (trackLength$ | async)?.toFixed(2) }}</span>
    </div>
  }
</div>
